data:
  # Keep this order aligned with the seven-file dataset used by the legacy
  # enhance-V1/with_enhance_surface training run.
  train_file:
    - ${variables.data_root}/Li_bulk_lambda0_del.xyz
    - ${variables.data_root}/Li_bulk_lambda0.xyz
    - ${variables.data_root}/Li_bulk_lambda1_del.xyz
    - ${variables.data_root}/Li_bulk_lambda1.xyz
    - ${variables.data_root}/Li-surface.xyz
    - ${variables.data_root}/Li-bulk-lambda0_mdv1_del.xyz
    - ${variables.data_root}/Li-bulk-lambda0_mdv1.xyz
  pair_train_file: null
  test_file: null
  energy_reference: ${variables.results_root}/single-sol/references/mattersim-1m-conservative-ase-pretrained-residual-ridge-alpha1p0.json
  train_split: 0.9
  shuffle: true
  shuffle_seed: 42
  batch_size: 8
  num_workers: 4
  pin_memory: false
  max_parent_frame: null
